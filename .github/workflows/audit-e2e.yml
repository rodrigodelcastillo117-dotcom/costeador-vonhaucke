name: Audit E2E Branch

on:
  push:
    branches:
      - audit/sales-directors-95

concurrency:
  group: audit-e2e-sales-directors
  cancel-in-progress: true

jobs:
  verify-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Unit + build
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run e2e
