name: Certificación (labs reales contra producción)

# Corre los laboratorios reales (IA, Edge y base de PRODUCCIÓN, cuenta QA) de los tres flujos: Costear, Cocrear y Cotizar
# (planos con acomodo, texto y manual). Sólo en PRs con la etiqueta `certificar`: cada corrida gasta llamadas de IA.
# Un job por caso (fail-fast apagado): la evidencia de cada uno queda como artefacto `cert-<caso>`.
on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: certificacion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # La lista de casos vive en lab/certificacion/casos.json (para medir sólo lo necesario en cada corrida).
  # Casos posibles: costear-<hoja>, cocrear-<1..8>, plano-<C1..C6>, planorc-<C1..C6>, texto, manual.
  plan:
    if: contains(github.event.pull_request.labels.*.name, 'certificar')
    runs-on: ubuntu-latest
    outputs:
      casos: ${{ steps.leer.outputs.casos }}
    steps:
      - uses: actions/checkout@v4
      - id: leer
        run: echo "casos=$(tr -d '\n' < lab/certificacion/casos.json)" >> "$GITHUB_OUTPUT"
  caso:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # La IA tiene un límite de 40 análisis por hora por usuario (analizar-mueble): pocos casos a la vez.
      max-parallel: 3
      matrix:
        caso: ${{ fromJSON(needs.plan.outputs.casos) }}
    env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install matplotlib
      - name: Caso ${{ matrix.caso }}
        run: bash lab/certificacion/caso.sh ${{ matrix.caso }}
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert-${{ matrix.caso }}
          path: lab/certificacion/ci/${{ matrix.caso }}
          if-no-files-found: warn
          retention-days: 14
