name: CI

# Corre la suite y el build en CADA push y PR. Blinda "una sola verdad": nada roto
# llega lejos sin que CI lo marque en rojo.
#
# ⚠️ Bloque 0 (2026-10-10). Esto estuvo en `workflow_dispatch` (manual) "para evitar
# ruido". El costo fue real: con 1,014 pruebas verdes en el repo, VH-002 (puestos
# re-estimados por geometría) volvió a producción en beaa005 porque nadie estaba
# obligado a correrlas. El ruido se controla con `concurrency` (se cancela la corrida
# vieja al llegar un push nuevo), NO apagando la red de seguridad. No volver a manual.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Tamaño del bundle (visibilidad)
        run: ls -lh dist/index.html

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (smoke)
        run: npm run e2e
