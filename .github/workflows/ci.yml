name: CI

# Un feature branch con PR abierto corría DOS veces por commit (push + PR),
# generando una lluvia de correos y corridas canceladas cuando entraba el commit
# siguiente. Las ramas de trabajo se verifican por pull_request; las ramas base
# siguen verificándose también si reciben un push directo.
on:
  push:
    branches:
      - c3.4-seller-safe
      - demo-ceo-autopoblar-zonas
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Tamaño del bundle (visibilidad)
        run: ls -lh dist/index.html

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (smoke)
        run: npm run e2e
