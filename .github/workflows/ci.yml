name: CI

# Un feature branch con PR abierto corría DOS veces por commit (push + PR),
# generando una lluvia de correos y corridas canceladas cuando entraba el commit
# siguiente. Las ramas de trabajo se verifican por pull_request; las ramas base
# siguen verificándose también si reciben un push directo.
on:
  push:
    branches:
      - c3.4-seller-safe
      - demo-ceo-autopoblar-zonas
      - chatgpt/perfection-v2-20261005
  pull_request:
  workflow_dispatch:

# Una sola corrida viva por PR/rama. Si entra un commit nuevo, cancela la anterior
# en vez de terminar dos builds obsoletos y disparar más notificaciones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # P1-REL-01: se prueba EXACTAMENTE el commit del PR (el FINAL_SHA), no el merge sintético con la base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Auditoría dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Tamaño del bundle (visibilidad)
        run: ls -lh dist/index.html

  e2e:
    name: E2E público + autenticado si hay cuenta de prueba
    runs-on: ubuntu-latest
    env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      # Cada corrida deja SU presupuesto golden con nombre propio: dos CI en paralelo con la misma cuenta ya no se pisan
      # (19-oct: golden757Edicion buscaba "Torre Sur (golden)" y encontró el de la otra corrida).
      GOLDEN_CLIENTE: Torre Sur (golden) ${{ github.run_id }}-${{ github.run_attempt }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # P1-REL-01: se prueba EXACTAMENTE el commit del PR (el FINAL_SHA), no el merge sintético con la base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Estado de certificación autenticada
        shell: bash
        run: |
          if [[ -n "$TEST_EMAIL" && -n "$TEST_PASSWORD" ]]; then
            echo "### ✅ AUTH E2E CERTIFICADO EN ESTA CORRIDA" >> "$GITHUB_STEP_SUMMARY"
            echo "Se ejecutarán login, Cocrear y Cotizar con la cuenta de prueba." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=AUTH E2E NO CERTIFICADO::Faltan TEST_EMAIL/TEST_PASSWORD. Esta corrida sólo certifica smoke público; los tests autenticados quedan skipped."
            echo "### ⚠️ AUTH E2E NO CERTIFICADO" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secrets TEST_EMAIL / TEST_PASSWORD. Un check verde de este job NO certifica login/Cocrear/Cotizar autenticados." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E público + auth condicional
        run: npm run e2e
      # Seguridad (19-oct): el error-context de Playwright incluye el VALOR de los campos de texto; si el login falla,
      # la contraseña de la cuenta QA quedaba en el artefacto. Se tacha cualquier aparición de los secretos antes de subir.
      - name: Tachar secretos de la evidencia
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          secretos = [s for s in (os.environ.get('TEST_PASSWORD'), os.environ.get('TEST_EMAIL')) if s and len(s) >= 4]
          for p in pathlib.Path('test-results').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in ('.md', '.txt', '.json', '.log', '.html', '.yml'):
                  continue
              t = p.read_text(errors='ignore'); n = t
              for s in secretos: n = n.replace(s, '•••')
              if n != t: p.write_text(n)
          PY
      - name: Guardar capturas/artefactos de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
