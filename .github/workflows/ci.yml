name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Tamaño del bundle (visibilidad)
        run: ls -lh dist/index.html

  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_EXTERNAL: '1'
      E2E_BASE_URL: 'https://costeador-vonhaucke.vercel.app/'
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E producción (smoke + autenticado si hay secretos)
        run: npm run e2e
