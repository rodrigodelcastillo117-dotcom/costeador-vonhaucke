name: CI

# Corre la suite y el build en cada push y PR. Blinda "una sola verdad": nada roto
# llega lejos sin que CI lo marque en rojo. (Se activa al agregar el remoto de GitHub.)
on:
  workflow_dispatch:

# Política permanente: NO ejecutar CI automáticamente en push/PR.
# Las validaciones se disparan manualmente sólo cuando un bloque está listo,
# evitando ruido, builds redundantes y notificaciones por cada commit.
concurrency:
  group: ci-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Tamaño del bundle (visibilidad)
        run: ls -lh dist/index.html

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (smoke)
        run: npm run e2e
